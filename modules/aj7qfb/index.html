<header class="modulex-ust-cekmece{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-ust-cekmece-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</header>

<style>
  /* ust-cekmece — Masaüstünde bile menü gizli: sade vitrin, gezinme dergi içindekiler gibi çekmecede; perde, odak tuzağı ve Esc ile. */
  .modulex-ust-cekmece { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-cekmece *, .modulex-ust-cekmece *::before, .modulex-ust-cekmece *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-cekmece :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-cekmece :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-cekmece :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-cekmece :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-cekmece img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-cekmece) img { height: auto; }
  .modulex-ust-cekmece [hidden] { display: none !important; }
  .modulex-ust-cekmece :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-cekmece :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-cekmece-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-cekmece-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-cekmece--bassiz .modulex-ust-cekmece-bas { display: none; }
  .modulex-ust-cekmece-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ust-cekmece-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ust-cekmece-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-cekmece-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-cekmece-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-cekmece-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-cekmece-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-cekmece-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ust-cekmece-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ust-cekmece { position: relative; z-index: 900; }
  .modulex-ust-cekmece-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-cekmece-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-cekmece-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-cekmece-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-cekmece-oge:hover, .modulex-ust-cekmece-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-cekmece-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-cekmece-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-cekmece-cta .material-symbols-outlined, .modulex-ust-cekmece-tel .material-symbols-outlined, .modulex-ust-cekmece-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-cekmece-tel, .modulex-ust-cekmece-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-cekmece-tel:hover, .modulex-ust-cekmece-posta:hover { color: --accentInk--; }
  .modulex-ust-cekmece-dil:empty { display: none; }
  .modulex-ust-cekmece-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-cekmece-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-cekmece-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-cekmece--acik .modulex-ust-cekmece-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-cekmece--acik .modulex-ust-cekmece-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-cekmece--acik .modulex-ust-cekmece-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-cekmece-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-cekmece-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-cekmece-sol 0.3s ease both; }
  @keyframes modulex-ust-cekmece-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-cekmece-cubuk { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; padding-block: 12px; }
  .modulex-ust-cekmece--js .modulex-ust-cekmece-ac { display: inline-flex; justify-self: start; }
  .modulex-ust-cekmece--js .modulex-ust-cekmece-nav--yedek { display: none; }
  .modulex-ust-cekmece-liste { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 24px; padding-block-end: 10px; }
  .modulex-ust-cekmece-son { display: flex; justify-content: flex-end; }
  .modulex-ust-cekmece-panel { position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 2; display: grid; grid-template-rows: auto 1fr auto; gap: 24px; width: min(440px, 88vw); padding: 22px clamp(20px, 4vw, 40px) 28px; overflow-y: auto; background: --bg--; box-shadow: 0 0 60px -20px color-mix(in srgb, --text-- 60%, transparent); animation: modulex-ust-cekmece-kay 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes modulex-ust-cekmece-kay { from { transform: translateX(-100%); } to { transform: none; } }
  [dir="rtl"] .modulex-ust-cekmece-panel { animation-name: modulex-ust-cekmece-kayr; }
  @keyframes modulex-ust-cekmece-kayr { from { transform: translateX(100%); } to { transform: none; } }
  .modulex-ust-cekmece-ptepe { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .modulex-ust-cekmece-pliste { display: grid; align-content: center; counter-reset: modulex-ust-cekmece-s; }
  .modulex-ust-cekmece-poge { position: relative; display: flex; align-items: baseline; gap: 14px; padding-block: 10px; color: inherit; font-family: var(--mx-font-heading, inherit); font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; text-decoration: none; transition: color 0.25s ease, transform 0.3s ease; }
  .modulex-ust-cekmece-poge::before { counter-increment: modulex-ust-cekmece-s; content: counter(modulex-ust-cekmece-s, decimal-leading-zero); color: --accentInk--; font-size: 0.9rem; font-weight: 700; }
  .modulex-ust-cekmece-poge:hover, .modulex-ust-cekmece-poge[aria-current="page"] { color: --accentInk--; transform: translateX(6px); }
  [dir="rtl"] .modulex-ust-cekmece-poge:hover { transform: translateX(-6px); }
  .modulex-ust-cekmece-palt { display: grid; gap: 10px; padding-block-start: 18px; border-block-start: 1px solid --cizgi--; }
  @media (max-width: 768px) {
    .modulex-ust-cekmece-ac-yazi { display: none; }
    .modulex-ust-cekmece-cubuk { grid-template-columns: auto minmax(0, 1fr) auto; }
    .modulex-ust-cekmece-cta { padding-inline: 14px; font-size: 0.9rem; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-cekmece :is(.modulex-ust-cekmece-baslik, .modulex-ust-cekmece-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-cekmece-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-cekmece { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-cekmece *, .modulex-ust-cekmece *::before, .modulex-ust-cekmece *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-cekmece";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
    });
  })();
</script>
